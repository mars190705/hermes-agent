# Windows-friendly compose file for Hermes Agent.
#
# Differences from the upstream docker-compose.yml:
#   - Uses bridge networking instead of network_mode: host, because Docker
#     Desktop on Windows routes "host" to the WSL2 VM, not the Windows
#     host — so localhost:9119 in a Windows browser would not see the
#     dashboard otherwise.
#   - Dashboard is published on 127.0.0.1:9119 only (not LAN-accessible).
#   - Volumes use ${USERPROFILE}/.hermes so the path resolves on Windows.
#   - .env is loaded via env_file so OPENROUTER_API_KEY / TELEGRAM_* land
#     in both gateway and dashboard.
#
# Usage:
#   docker compose -f docker-compose.windows.yml up -d --build
#
services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    volumes:
      - ${USERPROFILE}/.hermes:/opt/data
      # Per-skill terminal backends spawn sibling containers via Docker
      # Desktop's daemon. The Linux VM exposes the socket at the same path
      # as native Linux, so the mount works identically. The leading double
      # slash is required by Docker Desktop on Windows to prevent Git Bash /
      # MSYS path-mangling. Required for skills with `backend:` frontmatter.
      - //var/run/docker.sock:/var/run/docker.sock
      # Resolve symlinks under ~/.hermes/skills/ that point at
      # ~/.agents/skills/ (created by `npx skills add` from inside a
      # container, with the path captured as /mnt/host/c/Users/<user>/...).
      # Without this mount the symlinks dangle inside the gateway and
      # skill_view() fails for the pptx/docx/xlsx/akshare-stock entries.
      - ${USERPROFILE}/.agents:/mnt/host/c/Users/vincent/.agents:ro
    env_file:
      - .env
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ${USERPROFILE}/.hermes:/opt/data
    env_file:
      - .env
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # The dashboard is a web UI, not a messaging endpoint. Without this
      # override it inherits TELEGRAM_BOT_TOKEN from env_file and boots a
      # SECOND Telegram poller, which fights the gateway container for the
      # same bot: both then loop forever on "Conflict: terminated by other
      # getUpdates request". The adapter's is_enabled() gates on a non-blank
      # token, so blanking it here disables Telegram for this service only —
      # `environment:` takes precedence over `env_file:`.
      - TELEGRAM_BOT_TOKEN=
    ports:
      - "127.0.0.1:9119:9119"
    # Binding 0.0.0.0 is required for Docker port publishing to reach the
    # process. `--insecure` used to be the escape hatch that allowed that
    # without auth; since the June 2026 hardening it is a NO-OP and a
    # non-loopback bind is REFUSED unless an auth provider is configured —
    # the container just crash-looped on startup. The gate is satisfied by
    # dashboard.basic_auth (username + password_hash) in
    # ${USERPROFILE}/.hermes/config.yaml. Exposure is still limited to
    # 127.0.0.1 by the `ports:` mapping above.
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
